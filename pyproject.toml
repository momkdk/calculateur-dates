[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calculateur-dates"
version = "0.1.0"
description = "Âge exact, écart entre deux dates, ajout/soustraction de jours"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ali El Amri" }]
keywords = ["dates", "age", "calendrier"]

[project.scripts]
calculateur-dates = "calculateur_dates.__main__:main"

[tool.setuptools]
packages = ["calculateur_dates"]
